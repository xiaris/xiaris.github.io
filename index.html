<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homepage | Ruisong Xia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              void: '#02040a',
              cosmic: {
                blue: '#0ea5e9', // Deep Scientific Blue
                dark: '#0c1220',
                accent: '#0284c7'
              },
              event: {
                orange: '#f59e0b',
                red: '#dc2626',
                core: '#000000'
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['Roboto Mono', 'monospace'],
            },
            animation: {
              'spin-slow': 'spin 20s linear infinite',
              'spin-reverse-slow': 'spin 25s linear infinite reverse',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #02040a;
        color: #e2e8f0;
        overflow-x: hidden;
      }
      .research-manifesto {
        position: absolute;
        z-index: 10;
        bottom: 3.5rem;
        left: 0;
        width: 100%;
        padding: 0 1.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: #c5dbea;
        font-size: clamp(1.1rem, 2vw, 1.75rem);
        font-weight: 500;
        line-height: 1.6;
        letter-spacing: 0.01em;
        pointer-events: none;
      }
      .research-manifesto-word {
        display: inline-block;
        white-space: pre;
        animation: manifesto-float 5s ease-in-out infinite;
      }
      .research-scroll-link {
        display: inline-flex;
        margin-top: 0.6rem;
        padding: 0.65rem;
        border-radius: 9999px;
        color: #7da9be;
        pointer-events: auto;
        animation: manifesto-arrow 2.5s ease-in-out infinite;
        transition: color 0.2s, background-color 0.2s, box-shadow 0.2s;
      }
      .research-scroll-link:hover, .research-scroll-link:focus-visible {
        color: #d9f4ff;
        background-color: rgba(56, 189, 248, 0.1);
        box-shadow: 0 0 20px rgba(56, 189, 248, 0.18);
      }
      .research-scroll-link:focus-visible { outline: 2px solid #7dd3fc; outline-offset: 3px; }
      @keyframes manifesto-arrow {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(5px); }
      }
      @keyframes manifesto-float {
        0%, 100% { transform: translateY(0) rotate(-1deg); }
        50% { transform: translateY(-6px) rotate(1deg); }
      }
      @media (max-width: 767px) {
        #hero.hero-section {
          height: auto;
          min-height: 100vh;
          min-height: 100svh;
          flex-direction: column;
          align-items: stretch;
        }
        #hero .hero-mask {
          width: 100%;
          background: linear-gradient(90deg, rgba(2, 4, 10, 0.96), rgba(2, 4, 10, 0.62));
        }
        #hero .hero-content {
          width: 100%;
          height: auto;
          padding-top: 7rem;
        }
        #hero .research-manifesto {
          position: relative;
          bottom: auto;
          margin-top: auto;
          padding: 3rem 1.5rem 1.5rem;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .research-manifesto-word, .research-scroll-link { animation: none; }
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #02040a;
      }
      ::-webkit-scrollbar-thumb {
        background: #1e293b;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #0ea5e9;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.24",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "three": "https://esm.sh/three@0.173.0",
    "@react-three/fiber": "https://esm.sh/@react-three/fiber@9.0.4?external=react,react-dom,three",
    "@react-three/drei": "https://esm.sh/@react-three/drei@10.0.3?external=react,react-dom,three,@react-three/fiber",
    "transparent": "https://esm.sh/transparent@^0.0.1"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
